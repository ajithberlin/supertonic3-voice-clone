name: Publish container to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "postman/**"
      - "samples/**"
      - "assets/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "samples/**"
      - "assets/**"
  workflow_dispatch:
    inputs:
      inference_only:
        description: "Build the slim inference-only image (no torch / no style training)"
        type: boolean
        default: false
      bake_model:
        description: "Bake the Supertone weights into the image"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_server.txt -r requirements_infer.txt pytest httpx
      - name: Run the batch-server test suite
        run: pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The CUDA base plus torch and the baked weights do not fit next to the
      # tooling GitHub preinstalls on the runner.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # GitHub coerces an unset boolean input to '' , and '' == false, so the
      # build flags are resolved explicitly rather than inline in the expressions.
      - name: Resolve build options
        id: opts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            training=${{ inputs.inference_only == true && 'false' || 'true' }}
            bake=${{ inputs.bake_model == true && 'true' || 'false' }}
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            training=true
            bake=false
          else
            training=true
            bake=true
          fi
          {
            echo "training=${training}"
            echo "bake=${bake}"
            if [ "${training}" = "false" ]; then echo "suffix=-inference"; else echo "suffix="; fi
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=${{ steps.opts.outputs.suffix }},onlatest=true

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || ' (validation only)' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_TRAINING=${{ steps.opts.outputs.training }}
            BAKE_MODEL=${{ steps.opts.outputs.bake }}
            TORCH_CHANNEL=cu128
            CUDA_IMAGE=nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "### Image builds cleanly"
              echo
              echo "Built from \`docker/Dockerfile\` without pushing. Weights are not baked"
              echo "on pull requests; the publish on \`main\` bakes them in."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Run it on a RunPod / Vast.ai GPU box:"
            echo
            echo '```bash'
            echo "docker run --gpus all -p 8000:8000 -v supertonic-data:/data \\"
            echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
